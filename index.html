<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABC Keyboard Fun 🎈</title>
<meta name="description" content="A fun keyboard learning game for little kids. Press any key and see letters, colors and hear sounds!">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  body {
    background: linear-gradient(160deg, #fdf6e3, #ffe9f0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
  }

  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- Top bar (parent controls) ---------- */
  #topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    z-index: 10;
  }

  .mode-buttons { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    background: #ffffffcc;
    color: #555;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
  }
  .btn.active { background: #ffd166; color: #6b4b00; }

  .icon-buttons { display: flex; gap: 8px; }
  .icon-btn {
    border: none;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    font-size: 1.3rem;
    cursor: pointer;
    background: #ffffffcc;
    box-shadow: 0 3px 8px rgba(0,0,0,.12);
  }

  /* ---------- Main stage ---------- */
  #stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    z-index: 6;
    min-height: 0;
    position: relative;
  }

  #big-display {
    font-size: clamp(5rem, 24vh, 14rem);
    font-weight: 900;
    line-height: 1.1;
    transition: color .1s;
  }

  #big-display.pop { animation: pop .45s ease; }
  @keyframes pop {
    0%   { transform: scale(.3) rotate(-8deg); }
    60%  { transform: scale(1.15) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  #big-display.wobble { animation: wobble .4s ease; }
  @keyframes wobble {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-14px); }
    75% { transform: translateX(14px); }
  }

  #word-display {
    font-size: clamp(1.4rem, 5.5vh, 3rem);
    font-weight: bold;
    color: #7a6ff0;
    margin-top: 6px;
    min-height: 1.3em;
  }

  /* word-being-typed letters */
  #word-display .done { color: #06d6a0; }
  #word-display .next { color: #ef476f; text-decoration: underline; }
  #word-display .todo { color: #c9c2ba; }

  #hint-display {
    font-size: clamp(1rem, 3.5vh, 1.5rem);
    color: #b0a8a0;
    margin-top: 8px;
    min-height: 1.3em;
  }

  #stars {
    font-size: clamp(1.3rem, 4vh, 2rem);
    margin-top: 4px;
    min-height: 1.3em;
    letter-spacing: 3px;
  }

  #progress {
    font-size: clamp(1rem, 3vh, 1.5rem);
    margin-top: 6px;
    min-height: 1.3em;
    color: #8d857d;
    letter-spacing: 2px;
  }

  /* ---------- Task menu ---------- */
  #task-menu {
    position: absolute;
    inset: 0;
    z-index: 8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 10px;
  }
  #task-menu.open { display: flex; }

  #task-menu h2 {
    color: #7a6ff0;
    font-size: clamp(1.3rem, 4.5vh, 2.2rem);
  }

  #task-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 760px;
  }

  .task-card {
    border: none;
    font-family: inherit;
    cursor: pointer;
    background: #ffffffe6;
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,.10);
    width: 128px;
    padding: 14px 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .task-card .emoji { font-size: 2.6rem; }
  .task-card .name  { font-weight: bold; color: #6b6259; font-size: .95rem; }
  .task-card .earned { font-size: .9rem; min-height: 1.2em; letter-spacing: 1px; }

  #btn-back {
    display: none;
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
  }
  #btn-back.show { display: block; }

  /* ---------- On-screen keyboard ---------- */
  #keyboard {
    z-index: 6;
    padding: 6px 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    align-items: center;
    width: 100%;
    max-width: 800px;
  }

  .kb-row { display: flex; gap: 5px; justify-content: center; width: 100%; }

  .kb-key {
    flex: 1;
    max-width: 62px;
    height: clamp(34px, 6.5vh, 54px);
    border-radius: 10px;
    background: #ffffffd9;
    box-shadow: 0 3px 0 rgba(0,0,0,.10);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(.85rem, 2.4vh, 1.35rem);
    font-weight: bold;
    color: #7d746c;
  }
  .kb-key.wide { max-width: 340px; flex: 5; }

  .kb-key.lit {
    transform: translateY(3px) scale(1.06);
    color: #fff;
  }

  .kb-key.hint {
    animation: hintPulse 0.9s ease infinite;
    background: #ffd166;
    color: #6b4b00;
  }
  @keyframes hintPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #333333cc;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: .95rem;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s;
  }
  #toast.show { opacity: 1; }

  @media (max-height: 540px) {
    #keyboard { display: none; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="topbar">
  <div class="mode-buttons">
    <button class="btn active" id="btn-free">🎈 Free Play</button>
    <button class="btn" id="btn-hunt">🔎 Find the Letter</button>
    <button class="btn" id="btn-tasks">📝 Tasks</button>
  </div>
  <div class="icon-buttons">
    <button class="icon-btn" id="btn-sound" title="Sound on/off">🔊</button>
    <button class="icon-btn" id="btn-full" title="Fullscreen (Enter key)">⛶</button>
  </div>
</div>

<div id="stage">
  <button class="btn" id="btn-back">🏠 All Tasks</button>

  <div id="task-menu">
    <h2>Pick a task! 📝</h2>
    <div id="task-cards"></div>
  </div>

  <div id="big-display">🎈</div>
  <div id="word-display">Press any key!</div>
  <div id="hint-display">Enter = fullscreen</div>
  <div id="stars"></div>
  <div id="progress"></div>
</div>

<div id="keyboard"></div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= Data ================= */

  const WORDS = {
    A: ["Apple", "🍎"],    B: ["Ball", "⚽"],      C: ["Cat", "🐱"],
    D: ["Dog", "🐶"],      E: ["Elephant", "🐘"],  F: ["Fish", "🐟"],
    G: ["Grapes", "🍇"],   H: ["Hat", "🎩"],       I: ["Ice cream", "🍦"],
    J: ["Juice", "🧃"],    K: ["Kite", "🪁"],      L: ["Lion", "🦁"],
    M: ["Monkey", "🐵"],   N: ["Nest", "🪺"],      O: ["Orange", "🍊"],
    P: ["Penguin", "🐧"],  Q: ["Queen", "👑"],     R: ["Rainbow", "🌈"],
    S: ["Sun", "☀️"],      T: ["Tiger", "🐯"],     U: ["Umbrella", "☂️"],
    V: ["Violin", "🎻"],   W: ["Whale", "🐳"],     X: ["X-ray", "🩻"],
    Y: ["Yo-yo", "🪀"],    Z: ["Zebra", "🦓"]
  };

  const NUMBER_WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];

  const LITTLE_WORDS = [
    ["CAT","🐱"], ["DOG","🐶"], ["SUN","☀️"], ["BUS","🚌"], ["CUP","☕"],
    ["HAT","🎩"], ["BEE","🐝"], ["PIG","🐷"], ["EGG","🥚"], ["CAR","🚗"]
  ];

  const COLORS = ["#ef476f","#f78c6b","#ffd166","#06d6a0","#118ab2","#7a6ff0","#e76f51","#2a9d8f"];
  const PRAISE = ["Great job!","Yay! You found it!","Amazing!","Super!","Well done!","Wow!"];
  const FUN_KEYS = ["🎈","🌟","🎉","🚀","🦄","🌈","🍭","🐣","🎵","💫"];

  const ARROWS = {
    LEFT:  ["⬅️", "left"],
    UP:    ["⬆️", "up"],
    DOWN:  ["⬇️", "down"],
    RIGHT: ["➡️", "right"]
  };

  const KB_ROWS = [
    ["1","2","3","4","5","6","7","8","9","0"],
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L"],
    ["Z","X","C","V","B","N","M"],
    ["LEFT","UP","DOWN","RIGHT","SPACE"]
  ];
  const KB_LABELS = { LEFT:"◀", UP:"▲", DOWN:"▼", RIGHT:"▶", SPACE:"SPACE" };

  /* ================= State ================= */

  let mode = "free";           // "free" | "hunt" | "tasks"
  let soundOn = true;
  let target = null;           // current letter in hunt mode
  let wrongCount = 0;
  let starCount = 0;
  let activeTask = null;       // running task object, null = task menu
  let hintTimer = null;

  /* ---- saved progress (stars per task) ---- */
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem("kbfun-progress")) || {}; }
    catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem("kbfun-progress", JSON.stringify(p)); } catch (e) {}
  }
  let progress = loadProgress();

  /* ================= DOM ================= */

  const bigEl    = document.getElementById("big-display");
  const wordEl   = document.getElementById("word-display");
  const hintEl   = document.getElementById("hint-display");
  const starsEl  = document.getElementById("stars");
  const progEl   = document.getElementById("progress");
  const kbEl     = document.getElementById("keyboard");
  const toastEl  = document.getElementById("toast");
  const menuEl   = document.getElementById("task-menu");
  const cardsEl  = document.getElementById("task-cards");
  const btnBack  = document.getElementById("btn-back");

  const keyEls = {};
  KB_ROWS.forEach(row => {
    const rowEl = document.createElement("div");
    rowEl.className = "kb-row";
    row.forEach(k => {
      const kEl = document.createElement("div");
      kEl.className = "kb-key" + (k === "SPACE" ? " wide" : "");
      kEl.textContent = KB_LABELS[k] || k;
      kEl.addEventListener("pointerdown", e => { e.preventDefault(); routeKey(k); });
      rowEl.appendChild(kEl);
      keyEls[k] = kEl;
    });
    kbEl.appendChild(rowEl);
  });

  /* ================= Audio (WebAudio, no files needed) ================= */

  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, start, dur, type, vol) {
    const ac = ctx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ac.currentTime + start);
    gain.gain.linearRampToValueAtTime(vol || 0.18, ac.currentTime + start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + start + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(ac.currentTime + start);
    osc.stop(ac.currentTime + start + dur + 0.05);
  }

  function popSound() {
    if (!soundOn) return;
    tone(500 + Math.random() * 400, 0, 0.12, "triangle", 0.15);
  }

  function successSound() {
    if (!soundOn) return;
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.22, "sine", 0.16));
  }

  function gentleNo() {
    if (!soundOn) return;
    tone(220, 0, 0.18, "sine", 0.10);
  }

  /* ================= Speech ================= */

  function speak(text) {
    if (!soundOn || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    u.pitch = 1.2;
    speechSynthesis.speak(u);
  }

  /* ================= Confetti (low-end friendly) =================
     - canvas at 1x resolution (no devicePixelRatio upscaling)
     - hard cap on particle count
     - rAF loop only runs while particles exist                    */

  const MAX_PARTICLES = 150;
  const canvas = document.getElementById("confetti-canvas");
  const cctx = canvas.getContext("2d");
  let particles = [];
  let rafId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function burst(x, y, big) {
    const n = big ? 60 : 20;
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * (big ? 7 : 5);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3,
        size: 4 + Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 1,
        spin: Math.random() * 6
      });
    }
    if (particles.length > MAX_PARTICLES) {
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
    if (rafId === null) rafId = requestAnimationFrame(tick);
  }

  function tick() {
    cctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.life > 0);
    if (particles.length === 0) { rafId = null; return; }
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life -= 0.016;
      p.spin += 0.1;
      cctx.save();
      cctx.globalAlpha = Math.max(p.life, 0);
      cctx.translate(p.x, p.y);
      cctx.rotate(p.spin);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      cctx.restore();
    }
    rafId = requestAnimationFrame(tick);
  }

  function centerBurst(big) {
    burst(window.innerWidth / 2, window.innerHeight / 2.6, big);
  }

  /* ================= Display helpers ================= */

  function showBig(text, color) {
    bigEl.textContent = text;
    bigEl.style.color = color || COLORS[Math.floor(Math.random() * COLORS.length)];
    bigEl.classList.remove("pop", "wobble");
    void bigEl.offsetWidth; /* restart animation */
    bigEl.classList.add("pop");
  }

  function wobble() {
    bigEl.classList.remove("pop", "wobble");
    void bigEl.offsetWidth;
    bigEl.classList.add("wobble");
  }

  function lightKey(k) {
    const el = keyEls[k];
    if (!el) return;
    el.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    el.classList.add("lit");
    setTimeout(() => {
      el.classList.remove("lit");
      el.style.background = "";
    }, 220);
  }

  function clearHints() {
    clearTimeout(hintTimer);
    Object.values(keyEls).forEach(el => el.classList.remove("hint"));
  }

  /* Show a pulsing hint on the target key after a short wait,
     so the child gets a chance to find it alone first. */
  function armHint(key, delayMs) {
    clearHints();
    hintTimer = setTimeout(() => {
      if (keyEls[key]) keyEls[key].classList.add("hint");
    }, delayMs == null ? 4000 : delayMs);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  function clearStage() {
    wordEl.textContent = "";
    hintEl.textContent = "";
    starsEl.textContent = "";
    progEl.textContent = "";
  }

  /* ================= Free play ================= */

  function playFree(k) {
    if (WORDS[k]) {
      const [word, emoji] = WORDS[k];
      showBig(k);
      wordEl.textContent = emoji + " " + word;
      hintEl.textContent = "";
      popSound();
      centerBurst(false);
      speak(k + "! " + k + " for " + word + "!");
    } else if (/^[0-9]$/.test(k)) {
      const n = parseInt(k, 10);
      showBig(k);
      wordEl.textContent = n === 0 ? "Zero" : "⭐".repeat(n) + " " + NUMBER_WORDS[n];
      hintEl.textContent = "";
      popSound();
      centerBurst(false);
      speak(NUMBER_WORDS[n] + "!");
    } else {
      const fun = FUN_KEYS[Math.floor(Math.random() * FUN_KEYS.length)];
      showBig(fun);
      wordEl.textContent = "";
      hintEl.textContent = "";
      popSound();
      centerBurst(false);
    }
  }

  /* ================= Hunt mode ================= */

  function newTarget() {
    const letters = Object.keys(WORDS);
    let next;
    do {
      next = letters[Math.floor(Math.random() * letters.length)];
    } while (next === target);
    target = next;
    wrongCount = 0;
    clearHints();
    showBig(target, "#7a6ff0");
    wordEl.textContent = "Find this key!";
    hintEl.textContent = "";
    speak("Find the letter " + target + "!");
  }

  function playHunt(k) {
    if (!/^[A-Z0-9]$/.test(k)) return;
    if (k === target) {
      const [word, emoji] = WORDS[k];
      const praise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
      clearHints();
      showBig(emoji);
      wordEl.textContent = k + " for " + word + "!";
      hintEl.textContent = praise;
      starCount++;
      starsEl.textContent = "⭐".repeat(Math.min(starCount, 10));
      successSound();
      centerBurst(true);
      speak(praise + " " + k + " for " + word + "!");
      setTimeout(() => { if (mode === "hunt") newTarget(); }, 2600);
    } else {
      wrongCount++;
      wobble();
      gentleNo();
      if (wrongCount >= 3 && keyEls[target]) {
        keyEls[target].classList.add("hint");
        hintEl.textContent = "Look at the yellow key! 👇";
      } else {
        hintEl.textContent = "Try again! Find " + target;
      }
    }
  }

  /* ================= Tasks =================
     Each task teaches one small keyboard skill.
     Progress (stars) is saved in localStorage.  */

  const TASKS = [
    {
      id: "abc",
      name: "ABC Train",
      emoji: "🚂",
      intro: "Press the letters in order! Start with A.",
      start() {
        this.seq = Object.keys(WORDS);           // A..Z
        this.i = 0;
        this.showStep();
      },
      showStep() {
        const k = this.seq[this.i];
        showBig(k, "#118ab2");
        wordEl.textContent = "Press " + k;
        progEl.textContent = "🚂" + "🟩".repeat(this.i) + "⬜".repeat(this.seq.length - this.i);
        armHint(k);
        speak("Press " + k);
      },
      handleKey(k) {
        const want = this.seq[this.i];
        if (k === want) {
          popSound();
          burst(window.innerWidth / 2, window.innerHeight / 2.6, false);
          this.i++;
          if (this.i >= this.seq.length) finishTask(this);
          else this.showStep();
        } else if (/^[A-Z0-9]$/.test(k)) {
          taskWrong(want);
        }
      }
    },
    {
      id: "numbers",
      name: "Number Rocket",
      emoji: "🔢",
      intro: "Press the numbers in order! Start with 1.",
      start() {
        this.seq = ["1","2","3","4","5","6","7","8","9","0"];
        this.i = 0;
        this.showStep();
      },
      showStep() {
        const k = this.seq[this.i];
        showBig(k, "#e76f51");
        wordEl.textContent = "Press " + k;
        progEl.textContent = "🚀" + "🟨".repeat(this.i) + "⬜".repeat(this.seq.length - this.i);
        armHint(k);
        speak("Press " + k);
      },
      handleKey(k) {
        const want = this.seq[this.i];
        if (k === want) {
          popSound();
          burst(window.innerWidth / 2, window.innerHeight / 2.6, false);
          this.i++;
          if (this.i >= this.seq.length) finishTask(this);
          else this.showStep();
        } else if (/^[A-Z0-9]$/.test(k)) {
          taskWrong(want);
        }
      }
    },
    {
      id: "words",
      name: "Little Words",
      emoji: "🐱",
      intro: "Type little words, one letter at a time!",
      start() {
        /* 4 random words per round */
        this.words = LITTLE_WORDS.slice().sort(() => Math.random() - 0.5).slice(0, 4);
        this.wi = 0;
        this.li = 0;
        this.showStep(true);
      },
      showStep(newWord) {
        const [word, emoji] = this.words[this.wi];
        showBig(emoji);
        let html = "";
        for (let j = 0; j < word.length; j++) {
          const cls = j < this.li ? "done" : (j === this.li ? "next" : "todo");
          html += '<span class="' + cls + '">' + word[j] + "</span> ";
        }
        wordEl.innerHTML = html;
        progEl.textContent = "📖 " + (this.wi + 1) + " / " + this.words.length;
        const k = word[this.li];
        armHint(k);
        if (newWord) speak("Type the word " + word + "! Press " + k);
        else speak("Press " + k);
      },
      handleKey(k) {
        const [word] = this.words[this.wi];
        const want = word[this.li];
        if (k === want) {
          popSound();
          this.li++;
          if (this.li >= word.length) {
            successSound();
            centerBurst(true);
            speak("You typed " + word + "!");
            this.wi++;
            this.li = 0;
            if (this.wi >= this.words.length) { finishTask(this); return; }
            const self = this;
            setTimeout(() => { if (activeTask === self) self.showStep(true); }, 1800);
          } else {
            this.showStep(false);
          }
        } else if (/^[A-Z0-9]$/.test(k)) {
          taskWrong(want);
        }
      }
    },
    {
      id: "space",
      name: "Space Jump",
      emoji: "🐸",
      intro: "Press the big SPACE bar to make the frog jump!",
      start() {
        this.count = 0;
        this.goal = 10;
        this.showStep();
        speak("Press the space bar!");
      },
      showStep() {
        showBig("🐸", "#06d6a0");
        wordEl.textContent = "Press SPACE!";
        progEl.textContent = "🪷".repeat(this.count) + "⬜".repeat(this.goal - this.count);
        armHint("SPACE", 3000);
      },
      handleKey(k) {
        if (k === "SPACE") {
          popSound();
          burst(window.innerWidth / 2, window.innerHeight / 2.6, false);
          this.count++;
          if (this.count >= this.goal) finishTask(this);
          else {
            showBig("🐸", "#06d6a0");
            progEl.textContent = "🪷".repeat(this.count) + "⬜".repeat(this.goal - this.count);
          }
        }
      }
    },
    {
      id: "arrows",
      name: "Arrow Roads",
      emoji: "🚗",
      intro: "Press the arrow key that matches the arrow!",
      start() {
        const dirs = Object.keys(ARROWS);
        this.seq = [];
        for (let j = 0; j < 8; j++) {
          this.seq.push(dirs[Math.floor(Math.random() * dirs.length)]);
        }
        this.i = 0;
        this.showStep();
      },
      showStep() {
        const d = this.seq[this.i];
        showBig(ARROWS[d][0]);
        wordEl.textContent = "Press the " + ARROWS[d][1] + " arrow";
        progEl.textContent = "🚗 " + (this.i + 1) + " / " + this.seq.length;
        armHint(d, 3500);
        speak("Press the " + ARROWS[d][1] + " arrow!");
      },
      handleKey(k) {
        const want = this.seq[this.i];
        if (k === want) {
          popSound();
          burst(window.innerWidth / 2, window.innerHeight / 2.6, false);
          this.i++;
          if (this.i >= this.seq.length) finishTask(this);
          else this.showStep();
        } else if (ARROWS[k]) {
          taskWrong(want);
        }
      }
    }
  ];

  function taskWrong(want) {
    wobble();
    gentleNo();
    if (keyEls[want]) { clearHints(); keyEls[want].classList.add("hint"); }
    hintEl.textContent = "Look for the yellow key! 👇";
  }

  function finishTask(task) {
    clearHints();
    activeTask = null;
    progress[task.id] = Math.min((progress[task.id] || 0) + 1, 3);
    saveProgress(progress);
    showBig("🏆", "#ffd166");
    wordEl.textContent = "You did it!";
    hintEl.textContent = "";
    progEl.textContent = "";
    successSound();
    centerBurst(true);
    speak("Hooray! You finished " + task.name + "!");
    setTimeout(() => { if (mode === "tasks" && !activeTask) openTaskMenu(); }, 3000);
  }

  function starsFor(id) {
    const n = progress[id] || 0;
    return "⭐".repeat(n) + "☆".repeat(3 - n);
  }

  function buildTaskMenu() {
    cardsEl.innerHTML = "";
    TASKS.forEach(task => {
      const card = document.createElement("button");
      card.className = "task-card";
      card.innerHTML =
        '<span class="emoji">' + task.emoji + "</span>" +
        '<span class="name">' + task.name + "</span>" +
        '<span class="earned">' + starsFor(task.id) + "</span>";
      card.addEventListener("click", () => startTask(task));
      cardsEl.appendChild(card);
    });
  }

  function openTaskMenu() {
    activeTask = null;
    clearHints();
    clearStage();
    bigEl.textContent = "";
    buildTaskMenu();
    menuEl.classList.add("open");
    btnBack.classList.remove("show");
  }

  function closeTaskMenu() {
    menuEl.classList.remove("open");
  }

  function startTask(task) {
    closeTaskMenu();
    clearStage();
    activeTask = task;
    btnBack.classList.add("show");
    hintEl.textContent = task.intro;
    task.start();
  }

  btnBack.addEventListener("click", openTaskMenu);

  /* ================= Input routing ================= */

  /* k is a normalized key id: "A".."Z", "0".."9", "SPACE", "LEFT" ... */
  function routeKey(k) {
    lightKey(k);
    if (mode === "free") {
      playFree(k === "SPACE" || ARROWS[k] ? "•" : k);
    } else if (mode === "hunt") {
      playHunt(k);
    } else if (mode === "tasks" && activeTask) {
      activeTask.handleKey(k);
    }
  }

  function normalizeKey(e) {
    if (e.key === " " || e.code === "Space") return "SPACE";
    if (e.key === "ArrowLeft")  return "LEFT";
    if (e.key === "ArrowUp")    return "UP";
    if (e.key === "ArrowDown")  return "DOWN";
    if (e.key === "ArrowRight") return "RIGHT";
    if (e.key.length === 1) {
      const k = e.key.toUpperCase();
      if (/^[A-Z0-9]$/.test(k)) return k;
    }
    return null;
  }

  document.addEventListener("keydown", function (e) {
    /* Let browser shortcuts (Ctrl/Cmd/Alt combos) and F-keys work normally */
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^F\d+$/.test(e.key)) return;
    if (e.key === "Escape") return;

    /* Enter = fullscreen toggle (the special shortcut) */
    if (e.key === "Enter") {
      e.preventDefault();
      toggleFullscreen();
      return;
    }

    e.preventDefault();
    if (e.repeat) return;

    const k = normalizeKey(e);
    if (k) {
      routeKey(k);
    } else if (mode === "free") {
      /* shift, tab etc. — still give a fun reaction */
      const fun = FUN_KEYS[Math.floor(Math.random() * FUN_KEYS.length)];
      showBig(fun);
      wordEl.textContent = "";
      popSound();
      centerBurst(false);
    }
  });

  /* Tapping/clicking the stage also makes confetti (for touch screens) */
  document.getElementById("stage").addEventListener("pointerdown", function (e) {
    if (menuEl.classList.contains("open")) return;
    burst(e.clientX, e.clientY, false);
    popSound();
  });

  /* ================= Fullscreen ================= */

  function toggleFullscreen() {
    const doc = document;
    const el = doc.documentElement;
    if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => {
        toast("Fullscreen not available");
      });
      toast("Press Esc to exit fullscreen");
    } else {
      (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
    }
  }

  /* ================= Mode buttons ================= */

  const btnFree  = document.getElementById("btn-free");
  const btnHunt  = document.getElementById("btn-hunt");
  const btnTasks = document.getElementById("btn-tasks");
  const btnSound = document.getElementById("btn-sound");
  const btnFull  = document.getElementById("btn-full");

  function setMode(m) {
    mode = m;
    btnFree.classList.toggle("active", m === "free");
    btnHunt.classList.toggle("active", m === "hunt");
    btnTasks.classList.toggle("active", m === "tasks");
    clearHints();
    clearStage();
    closeTaskMenu();
    btnBack.classList.remove("show");
    activeTask = null;
    if (m === "free") {
      target = null;
      showBig("🎈", "#ef476f");
      wordEl.textContent = "Press any key!";
      hintEl.textContent = "Enter = fullscreen";
    } else if (m === "hunt") {
      starCount = 0;
      newTarget();
    } else {
      openTaskMenu();
    }
  }

  btnFree.addEventListener("click", () => setMode("free"));
  btnHunt.addEventListener("click", () => setMode("hunt"));
  btnTasks.addEventListener("click", () => setMode("tasks"));

  btnSound.addEventListener("click", () => {
    soundOn = !soundOn;
    btnSound.textContent = soundOn ? "🔊" : "🔇";
    if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  btnFull.addEventListener("click", toggleFullscreen);

  /* Block right-click menu so little hands don't get lost */
  document.addEventListener("contextmenu", e => e.preventDefault());

  /* Warm up speech voices (some browsers load them lazily) */
  if ("speechSynthesis" in window) speechSynthesis.getVoices();
})();
</script>
</body>
</html>
